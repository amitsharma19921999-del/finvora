<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0e" />
    <meta name="description" content="Finvora Trading Platform — invest, trade and track your portfolio." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Finvora — Trading Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Capture the PWA install prompt early (it can fire before React mounts)
      // so an in-app "Install app" button can offer it on demand.
      window.__bipReady = false;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault(); window.__bip = e; window.__bipReady = true;
        window.dispatchEvent(new Event('bip-available'));
      });
      window.addEventListener('appinstalled', () => { window.__bip = null; window.__bipReady = false; });
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        window.addEventListener('load', () => {
          // updateViaCache:'none' -> the SW script is always revalidated, so new
          // deploys are detected. On a new SW, reload once to pick up fresh assets.
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then((reg) => {
            reg.addEventListener('updatefound', () => {
              const nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', () => {
                if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                  nw.postMessage('skipWaiting');
                }
              });
            });
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              if (refreshing) return; refreshing = true; window.location.reload();
            });
          }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
